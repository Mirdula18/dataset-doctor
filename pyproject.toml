[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-doctor"
version = "0.1.2"
description = "Automatically diagnose and clean messy datasets for machine learning and data science."
readme = {file = "README_PYPI.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Dataset Doctor Contributors"},
]
keywords = ["data-quality", "data-cleaning", "machine-learning", "pandas", "eda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=1.5.3",
    "numpy>=1.23.5",
    "scikit-learn>=1.2.0",
    "PyYAML>=6.0.1",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
dataset-doctor = "dataset_doctor.cli:app"

[project.urls]
Homepage = "https://github.com/dataset-doctor/dataset-doctor"
Repository = "https://github.com/dataset-doctor/dataset-doctor"
Issues = "https://github.com/dataset-doctor/dataset-doctor/issues"

[tool.setuptools.packages.find]
include = ["dataset_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
